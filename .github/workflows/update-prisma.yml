name: update prisma

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prisma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-prisma:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adapter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adapter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Update Prisma packages
        run: pnpm update --latest @prisma/orm-postgres @prisma/orm-toolchain @ryangarber/prisma-orm-extension-zod

      - name: Sync package versions
        run: node .github/scripts/sync-version.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: ADAPTER_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/adapter_test pnpm test

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-prisma
          delete-branch: true
          commit-message: "chore(deps): update Prisma packages"
          title: "chore(deps): update Prisma packages"
          body: |
            Updates the Prisma ORM packages to their latest versions and keeps the peer dependency aligned.

            The package validation suite passed before this PR was created.
